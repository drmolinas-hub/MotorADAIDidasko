<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ADAI · Documentación</title>
<style>
:root { --ground:#f3f7fc; --surface:#fff; --ink:#0d1b2e; --muted:#4f6079; --rule:#d3dfee; --accent:#0b4fb5; --accent-ink:#fff; --deep:#002b5c; --error:#a32020; }
@media (prefers-color-scheme: dark) {
  :root { --ground:#0a111d; --surface:#101a2a; --ink:#e2eaf5; --muted:#9aaac0; --rule:#22324a; --accent:#6fa6ff; --accent-ink:#06142a; --deep:#bcd5ff; --error:#f4a6a6; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ground); color: var(--ink); font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; display: grid; place-items: center; padding: 16px; }
form { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 28px 24px; display: grid; gap: 14px; }
.marca { font-weight: 700; font-size: 22px; color: var(--deep); letter-spacing: .02em; margin: 0; }
p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
label { font-size: 14px; font-weight: 600; }
input[type=password] { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--ground); color: var(--ink); }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.recordar { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); font-weight: 400; }
button { font: inherit; font-weight: 600; font-size: 16px; padding: 11px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button[disabled] { opacity: .6; cursor: wait; }
.error { color: var(--error); font-size: 14px; min-height: 1.2em; }
</style>
</head>
<body>
<form id="f" autocomplete="on">
  <h1 class="marca">ADAI · Documentación</h1>
  <p>Documento privado. Escribe la contraseña para abrirlo.</p>
  <label for="pw">Contraseña</label>
  <input id="pw" type="password" autocomplete="current-password" required autofocus>
  <label class="recordar"><input id="rec" type="checkbox"> Recordar en este dispositivo</label>
  <button id="btn" type="submit">Abrir</button>
  <div class="error" id="err" role="alert"></div>
</form>

  var CLAVE_LS = "adai-docs-pass";
  function bytes(b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; }

  async function abrir(pass) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
